<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8"/>

<meta
name="viewport"
content="width=device-width,initial-scale=1"/>

<title>AR com WebXR</title>

<style>

body{
margin:0;
overflow:hidden;
background:#000;
font-family:sans-serif;
color:#fff;
}

#message{
position:fixed;
top:10px;
left:10px;
z-index:20;

background:#fff;
color:#000;

padding:8px;

border-radius:6px;

box-shadow:
0 2px 10px rgba(0,0,0,.2);
}

#errorBox{
position:fixed;

left:10px;
right:10px;
bottom:10px;

display:none;

z-index:21;

padding:10px;

background:
rgba(0,0,0,.85);

color:#fff;

border-radius:6px;

overflow:auto;

max-height:40vh;

font-size:13px;

font-family:monospace;
}

</style>


<script type="importmap">
{
"imports":{

"three":
"https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js",

"three/":
"https://cdn.jsdelivr.net/npm/three@0.154.0/"

}
}
</script>

<script
type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

</head>

<body>

<div id="message">
Iniciando…
</div>

<div id="errorBox"></div>

<script type="module">

(async()=>{

const showError=(t)=>{
const b=document.getElementById("errorBox");
b.style.display="block";
b.textContent+=t+"\n\n";
};

const setMessage=
m=>
document.getElementById("message")
.textContent=m;


const THREE=
await import("three");

const {GLTFLoader}=
await import(
"https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/loaders/GLTFLoader.js"
);

const {ARButton}=
await import(
"https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/webxr/ARButton.js"
);

const SkeletonUtilsModule=
await import(
"https://cdn.jsdelivr.net/npm/three@0.154.0/examples/jsm/utils/SkeletonUtils.js"
);

const SkeletonUtils=
SkeletonUtilsModule.default
||
SkeletonUtilsModule;



const renderer=
new THREE.WebGLRenderer({
antialias:true,
alpha:true
});

renderer.setPixelRatio(
window.devicePixelRatio
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.xr.enabled=true;

renderer.outputColorSpace=
THREE.SRGBColorSpace;

renderer.toneMapping=
THREE.ACESFilmicToneMapping;

document.body.appendChild(
renderer.domElement
);



const scene=
new THREE.Scene();

scene.matrixAutoUpdate=true;



const camera=
new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.01,
50
);



scene.add(
new THREE.AmbientLight(
0xffffff,
1.2
)
);



const dir=
new THREE.DirectionalLight(
0xffffff,
1
);

dir.position.set(
1,
2,
1
);

scene.add(dir);



const reticle=
new THREE.Mesh(

new THREE.RingGeometry(
0.07,
0.09,
32
).rotateX(
-Math.PI/2
),

new THREE.MeshBasicMaterial({
color:0x00ff88
})

);

reticle.visible=false;

reticle.matrixAutoUpdate=false;

scene.add(
reticle
);



const loader=
new GLTFLoader();

let baseGLTF;

let modelPrototype;

let modelReady=false;

let placedModel=null;



loader.load(

"aha2.glb",

(gltf)=>{

baseGLTF=gltf;

modelPrototype=
gltf.scene;


// MAIOR
modelPrototype.scale.set(
1.8,
1.8,
1.8
);

modelReady=true;

setMessage(
"Aponte para o chão e toque para posicionar."
);

},

undefined,

e=>showError(e)

);



document.body.appendChild(

ARButton.createButton(

renderer,

{
requiredFeatures:
["hit-test"],

optionalFeatures:
["local-floor"]
}

)

);



const mixers=[];

const clock=
new THREE.Clock();



const controller=
renderer.xr.getController(
0
);

scene.add(
controller
);



controller.addEventListener(

"select",

()=>{

if(
!modelReady
||
!reticle.visible
)
return;



if(
placedModel
){

placedModel.position
.setFromMatrixPosition(
reticle.matrix
);

return;

}



const clone=
SkeletonUtils.clone(
modelPrototype
);



clone.position
.setFromMatrixPosition(
reticle.matrix
);


// NÃO seguir câmera
clone.rotation.set(
0,
0,
0
);


// manter escala
clone.scale.copy(
modelPrototype.scale
);



scene.add(
clone
);

placedModel=
clone;



if(
baseGLTF.animations
){

const mixer=
new THREE.AnimationMixer(
clone
);

baseGLTF.animations.forEach(
a=>
mixer
.clipAction(a)
.play()
);

mixers.push(
mixer
);

}

}

);



const temp=
new THREE.Matrix4();



renderer.setAnimationLoop(

(_,frame)=>{

mixers.forEach(
m=>
m.update(
clock.getDelta()
)
);



if(frame){

const session=
renderer.xr.getSession();

const ref=
renderer.xr.getReferenceSpace();



if(
session
&&
!session.hit
){

session.hit=true;

session
.requestReferenceSpace(
"viewer"
)

.then(

vs=>

session
.requestHitTestSource({
space:vs
})

.then(
h=>
session.ht=h
)

);

}



if(
session?.ht
){

const hits=
frame.getHitTestResults(
session.ht
);



if(
hits.length
){

temp.fromArray(

hits[0]
.getPose(ref)
.transform
.matrix

);

reticle.matrix.copy(
temp
);

reticle.visible=true;

}

}

}



renderer.render(
scene,
camera
);

}

);



window.addEventListener(

"resize",

()=>{

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}

);

})();

</script>

</body>
</html>
