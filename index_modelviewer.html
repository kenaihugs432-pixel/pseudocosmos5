<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fallback AR — model-viewer</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body{
      margin:0;
      overflow:hidden;
      background:#000;
    }
    model-viewer{
      width:100%;
      height:100vh;
    }
  </style>
</head>
<body>
  <model-viewer
    src="aha2.glb"
    ios-src="aha.usdz"
    alt="Modelo AR"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls>
  </model-viewer>
</body>
</html>
